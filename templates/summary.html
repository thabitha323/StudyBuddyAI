
<!DOCTYPE html>
<html>
<head>
    <title>AI Summary - StudyBuddy AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h2>📝 AI PDF Summary</h2>

    {% if not summary %}
    <p>Click below to generate your PDF summary using Gemini AI.</p>
    {% endif %}

    <form method="POST" action="{{ url_for('summary') }}">
        <button type="submit">Generate Summary</button>
    </form>

    {% if summary %}
    <div class="generative-summary">
        <h2>Generative Summary</h2>
        <p>{{ summary }}</p>
    </div>
    {% endif %}

    <a href="/dashboard">⬅ Back to Dashboard</a>

</body>
</html>
