<!DOCTYPE html>
<html>
<head>
    <title>StudyBuddy AI - Ask AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>🤖 Ask StudyBuddy AI</h1>

    <form method="POST">

        <textarea
            name="question"
            rows="6"
            cols="70"
            placeholder="Ask any question..."
            required></textarea>

        <br><br>

        <button type="submit">
            Ask AI
        </button>

    </form>

    {% if answer %}

    <hr>

    <h2>Answer</h2>

    <pre style="white-space: pre-wrap;">{{ answer }}</pre>

    {% endif %}

    <br>

    <a href="/dashboard">⬅ Back to Dashboard</a>

</body>
</html>
